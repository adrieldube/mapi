<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title> Map Poster Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MapLibre GL -->
  <link href="https://unpkg.com/maplibre-gl@3.5.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.5.0/dist/maplibre-gl.js"></script>

  <!-- html2canvas for exporting the poster as PNG -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body class="bg-[#f3f3f3] text-[#111] font-sans m-0 h-screen overflow-hidden">
  <header class="px-8 py-5 bg-[#440edf] text-[#74e5c0] border-b border-[#e0e0e0]">
    <div class="flex items-center justify-between">
      <h1 class="m-0 text-xl  font-semibold tracking-[0.5px] flex items-center gap-2">
        <ion-icon name="map-outline" class="text-2xl"></ion-icon>
        MAPI
      </h1>
      <p class="m-0 text-md  tracking-wide opacity-90"> Map Posters Generator</p>
      <button
        class="cursor-pointer rounded-xl border border-transparent px-5 py-2.5 text-[13px] font-semibold transition-all duration-200 bg-[#74e5c0] text-[#000] hover:bg-[#440edf] hover:text-[#74e5c0] hover:border-[#74e5c0] hover:shadow-lg flex items-center gap-2"
        id="downloadBtn">
        <ion-icon name="download-outline" class="text-base"></ion-icon>
        Download PNG
      </button>
    </div>
  </header>

  <div id="container" class="flex h-[calc(100vh-61px)] overflow-hidden max-[900px]:flex-col max-[900px]:h-auto">
    <section id="controls"
      class="w-[320px] bg-[#fafafa] p-4 h-full overflow-y-auto shrink-0 max-[900px]:w-full max-[900px]:h-auto">

      <!-- Location Section -->
      <div class="mb-6">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-4 bg-[#440edf] rounded-full"></div>
          <span class="text-[10px] font-semibold tracking-[1.5px] uppercase text-[#888]">Location</span>
        </div>

        <div class="space-y-2">
          <div>
            <label for="cityInput" class="block text-[11px] font-medium text-[#666] mb-1">City / Place</label>
            <input id="cityInput" type="text" placeholder="Search for a city..."
              class="w-full px-3 py-2 text-[13px] rounded-lg border-0 bg-white shadow-sm outline-none transition-all duration-200 focus:shadow-md focus:ring-2 focus:ring-[#440edf]/20" />
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="zoomInput" class="text-[11px] font-medium text-[#666]">Zoom</label>
              <span id="zoomValue" class="text-[11px] font-semibold text-[#440edf]">13.0</span>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" id="zoomDecrement"
                class="flex items-center justify-center w-8 h-8 rounded-lg bg-white shadow-sm text-[#666] text-base transition-all duration-200 hover:shadow-md hover:text-[#440edf] active:scale-95">
                <ion-icon name="remove-outline"></ion-icon>
              </button>
              <div class="flex-1">
                <input id="zoomInput" type="range" min="1" max="20" step="0.1" value="13"
                  class="w-full h-1.5 appearance-none bg-[#e5e5e5] rounded-full cursor-pointer
                    [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-[#440edf] [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:transition-transform [&::-webkit-slider-thumb]:duration-200 [&::-webkit-slider-thumb]:hover:scale-110 [&::-webkit-slider-thumb]:shadow-md
                    [&::-moz-range-thumb]:w-4 [&::-moz-range-thumb]:h-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:bg-[#440edf] [&::-moz-range-thumb]:border-none [&::-moz-range-thumb]:cursor-pointer [&::-moz-range-thumb]:transition-transform [&::-moz-range-thumb]:duration-200 [&::-moz-range-thumb]:hover:scale-110 [&::-moz-range-thumb]:shadow-md" />
              </div>
              <button type="button" id="zoomIncrement"
                class="flex items-center justify-center w-8 h-8 rounded-lg bg-white shadow-sm text-[#666] text-base transition-all duration-200 hover:shadow-md hover:text-[#440edf] active:scale-95">
                <ion-icon name="add-outline"></ion-icon>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Poster Style Section -->
      <div class="mb-6">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-4 bg-[#440edf] rounded-full"></div>
          <span class="text-[10px] font-semibold tracking-[1.5px] uppercase text-[#888]">Poster Style</span>
        </div>

        <div class="space-y-2">
          <div>
            <label for="posterStyleSelect" class="block text-[11px] font-medium text-[#666] mb-1">Layout</label>
            <select id="posterStyleSelect"
              class="w-full px-3 py-2 text-[13px] rounded-lg border-0 bg-white shadow-sm outline-none transition-all duration-200 focus:shadow-md focus:ring-2 focus:ring-[#440edf]/20 cursor-pointer">
              <option value="minimal" selected>Minimal Luxury</option>
              <option value="vertical">Vertical Edge</option>
              <option value="corner">Corner Grid</option>
              <option value="oversized">Oversized Drama</option>
            </select>
          </div>

          <div>
            <label for="sizeSelect" class="block text-[11px] font-medium text-[#666] mb-1">Print Size</label>
            <select id="sizeSelect"
              class="w-full px-3 py-2 text-[13px] rounded-lg border-0 bg-white shadow-sm outline-none transition-all duration-200 focus:shadow-md focus:ring-2 focus:ring-[#440edf]/20 cursor-pointer">
              <option value="a1">A1 — 23.4 × 33.1 in / 59.4 × 84.1 cm</option>
              <option value="a2">A2 — 16.5 × 23.4 in / 42 × 59.4 cm</option>
              <option value="a3">A3 — 11.7 × 16.5 in / 29.7 × 42 cm</option>
              <option value="24x36" selected>24 × 36 in / 61 × 91.4 cm</option>
              <option value="18x24">18 × 24 in / 45.7 × 61 cm</option>
              <option value="16x20">16 × 20 in / 40.6 × 50.8 cm</option>
              <option value="11x14">11 × 14 in / 27.9 × 35.6 cm</option>
            </select>
          </div>

          <div>
            <label for="styleSelect" class="block text-[11px] font-medium text-[#666] mb-1">Color Theme</label>

            <!-- Selected Theme Preview -->
            <div id="selectedThemePreview" class="mb-2 p-2 bg-white rounded-lg shadow-sm">
              <div class="flex items-center gap-3">
                <div id="selectedThemeSwatch" class="theme-swatch-large"></div>
                <div class="flex-1 min-w-0">
                  <div id="selectedThemeName" class="text-[12px] font-semibold text-[#333] truncate">Pure Black & White
                  </div>
                  <div class="flex gap-2 mt-1.5">
                    <div class="flex items-center gap-1">
                      <span id="selectedBgColor" class="color-dot"></span>
                      <span class="text-[9px] text-[#888]">Background</span>
                    </div>
                    <div class="flex items-center gap-1">
                      <span id="selectedRoadsColor" class="color-dot"></span>
                      <span class="text-[9px] text-[#888]">Roads</span>
                    </div>
                    <div class="flex items-center gap-1">
                      <span id="selectedWaterColor" class="color-dot"></span>
                      <span class="text-[9px] text-[#888]">Water</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- All Themes Grid -->
            <div class="mb-2">
              <div class="flex items-center justify-between mb-1">
                <span class="text-[10px] font-medium text-[#888]">All Themes</span>
                <button id="toggleThemesGrid"
                  class="text-[10px] text-[#440edf] hover:underline cursor-pointer bg-transparent border-none">Show
                  all</button>
              </div>
              <div id="themesGrid" class="themes-grid collapsed"></div>
            </div>

            <select id="styleSelect"
              class="w-full px-3 py-2 text-[13px] rounded-lg border-0 bg-white shadow-sm outline-none transition-all duration-200 focus:shadow-md focus:ring-2 focus:ring-[#440edf]/20 cursor-pointer">
              <option value="Sage Green & Terracotta">Sage Green & Terracotta</option>
              <option value="Midnight Navy & Gold">Midnight Navy & Gold</option>
              <option value="Blush Pink & Charcoal">Blush Pink & Charcoal</option>
              <option value="Forest Green & Cream">Forest Green & Cream</option>
              <option value="Deep Ocean Blue & Sand">Deep Ocean Blue & Sand</option>
              <option value="Rust Red & Ivory">Rust Red & Ivory</option>
              <option value="Lavender Purple & Slate">Lavender Purple & Slate</option>
              <option value="Emerald Green & Bone">Emerald Green & Bone</option>
              <option value="Burgundy Red & Beige">Burgundy Red & Beige</option>
              <option value="Teal Blue & Taupe">Teal Blue & Taupe</option>
              <option value="Cobalt Blue & Cream">Cobalt Blue & Cream</option>
              <option value="Mocha Brown & Mint Green">Mocha Brown & Mint Green</option>
              <option value="Pure Black & White" selected>Pure Black & White</option>
              <option value="Noir White & Black (Inverted)">Noir White & Black (Inverted)</option>
              <option value="Deep Navy Blue & White">Deep Navy Blue & White</option>
              <option value="Crimson Red & Ivory">Crimson Red & Ivory</option>
              <option value="Electric Blue & White">Electric Blue & White</option>
              <option value="Forest Green & White">Forest Green & White</option>
              <option value="Charcoal Grey & Snow White">Charcoal Grey & Snow White</option>
              <option value="Royal Purple & Cream">Royal Purple & Cream</option>
              <option value="Burnt Orange & White">Burnt Orange & White</option>
              <option value="Prussian Blue & White">Prussian Blue & White</option>
              <option value="Vermillion Red & Ecru">Vermillion Red & Ecru</option>
              <option value="Ink Black & Paper White">Ink Black & Paper White</option>
              <option value="Hot Pink & White">Hot Pink & White</option>
              <option value="Fuchsia Pink & Cream">Fuchsia Pink & Cream</option>
              <option value="Neon Green & Black">Neon Green & Black</option>
              <option value="Neon Cyan & Black">Neon Cyan & Black</option>
              <option value="Magenta Pink & White">Magenta Pink & White</option>
              <option value="Lime Yellow & Charcoal">Lime Yellow & Charcoal</option>
              <option value="Tangerine Orange & White">Tangerine Orange & White</option>
              <option value="Violet Purple & Ivory">Violet Purple & Ivory</option>
              <option value="Coral Red & Navy Blue">Coral Red & Navy Blue</option>
              <option value="Turquoise Blue & Cream">Turquoise Blue & Cream</option>
              <option value="Raspberry Pink & White">Raspberry Pink & White</option>
              <option value="Chartreuse Yellow & Black">Chartreuse Yellow & Black</option>
              <option value="Amber Gold & Slate Grey">Amber Gold & Slate Grey</option>
              <option value="Orchid Pink & White">Orchid Pink & White</option>
              <option value="Cyan Blue & Black">Cyan Blue & Black</option>
              <option value="Scarlet Red & Beige">Scarlet Red & Beige</option>
              <option value="Mint Green & Chocolate Brown">Mint Green & Chocolate Brown</option>
              <option value="Sapphire Blue & White">Sapphire Blue & White</option>
              <option value="Peach Orange & Graphite">Peach Orange & Graphite</option>
              <option value="Aqua Blue & Charcoal">Aqua Blue & Charcoal</option>
              <option value="Rose Pink & White">Rose Pink & White</option>
              <option value="Lemon Yellow & Navy Blue">Lemon Yellow & Navy Blue</option>
              <option value="Plum Purple & Cream">Plum Purple & Cream</option>
              <option value="Jade Green & Black">Jade Green & Black</option>
              <option value="Sunset Orange & White">Sunset Orange & White</option>
              <option value="Royal Blue & Coral Orange">Royal Blue & Coral Orange</option>
              <option value="Bright Yellow & Teal Blue">Bright Yellow & Teal Blue</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Options Section -->
      <div class="mb-6">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-4 bg-[#440edf] rounded-full"></div>
          <span class="text-[10px] font-semibold tracking-[1.5px] uppercase text-[#888]">Options</span>
        </div>

        <div class="flex items-center gap-3 p-2 bg-white rounded-lg shadow-sm">
          <div class="flex items-center gap-2">
            <span class="text-[12px] font-medium text-[#555]">Landscape</span>
            <div
              class="toggle-switch relative w-11 h-6 bg-[#e0e0e0] rounded-full cursor-pointer transition-colors duration-300 after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:w-[18px] after:h-[18px] after:bg-white after:rounded-full after:transition-transform after:duration-300 after:shadow-sm [&.active]:bg-[#440edf] [&.active]:after:translate-x-5"
              id="orientationToggle"></div>
          </div>

          <div class="w-px h-6 bg-[#e0e0e0]"></div>

          <div class="flex items-center gap-2">
            <span class="text-[12px] font-medium text-[#555]">Labels</span>
            <div
              class="toggle-switch active relative w-11 h-6 bg-[#e0e0e0] rounded-full cursor-pointer transition-colors duration-300 after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:w-[18px] after:h-[18px] after:bg-white after:rounded-full after:transition-transform after:duration-300 after:shadow-sm [&.active]:bg-[#440edf] [&.active]:after:translate-x-5"
              id="labelsToggle"></div>
          </div>
        </div>
      </div>

      <!-- Labels Section -->
      <div id="labelFields" class="mb-4">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-4 bg-[#440edf] rounded-full"></div>
          <span class="text-[10px] font-semibold tracking-[1.5px] uppercase text-[#888]">Labels</span>
        </div>

        <div class="space-y-2">
          <div>
            <label for="titleInput" class="block text-[11px] font-medium text-[#666] mb-1">Title</label>
            <input id="titleInput" type="text" placeholder="City name" value="HAVANA"
              class="w-full px-3 py-2 text-[13px] rounded-lg border-0 bg-white shadow-sm outline-none transition-all duration-200 focus:shadow-md focus:ring-2 focus:ring-[#440edf]/20" />
          </div>

          <div>
            <label for="subtitleInput" class="block text-[11px] font-medium text-[#666] mb-1">Subtitle</label>
            <input id="subtitleInput" type="text" placeholder="Optional tagline" value="The Pearl of the Antilles"
              class="w-full px-3 py-2 text-[13px] rounded-lg border-0 bg-white shadow-sm outline-none transition-all duration-200 focus:shadow-md focus:ring-2 focus:ring-[#440edf]/20" />
          </div>

          <div>
            <label for="taglineInput" class="block text-[11px] font-medium text-[#666] mb-1">Tagline</label>
            <input id="taglineInput" type="text" placeholder="40.712° N — 74.006° W" value=""
              class="w-full px-3 py-2 text-[13px] rounded-lg border-0 bg-white shadow-sm outline-none transition-all duration-200 focus:shadow-md focus:ring-2 focus:ring-[#440edf]/20" />
          </div>
        </div>
      </div>

      <!-- Status & Attribution -->
      <div class="mt-auto">
        <div id="status" class="text-[11px] min-h-[16px] text-center text-[#888]">&nbsp;</div>

        <div id="attribution" class="mt-4 pt-2 border-t border-[#e5e5e5] text-[9px] text-center text-[#aaa]">
          © OpenStreetMap contributors · Tiles © MapTiler
        </div>
      </div>
    </section>

    <section id="posterWrapper" class="flex-1 flex justify-center items-center p-4 bg-[#fff] overflow-hidden">
      <div id="poster" class="poster-style-minimal rounded-xl">
        <div id="mapContainer"></div>
        <div id="posterFooter">
          <div id="cityTitle">HAVANA</div>
          <div id="citySubtitle">The Pearl of the Antilles</div>
          <div id="coordinates">23.114° N — 82.367° W</div>
        </div>
      </div>
    </section>
  </div>

  <!-- App Script -->
  <script src="js/app.js"></script>
</body>

</html>
