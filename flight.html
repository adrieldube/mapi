<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="dns-prefetch" href="https://unpkg.com" />

  <title>MAPI — Flight Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Simulate a flight between any two cities on a beautiful styled map. Watch a plane trace its route in real-time." />
  <meta name="theme-color" content="#440edf" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- MapLibre GL -->
  <link rel="preload" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" as="style" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Three.js for 3D Globe -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- App Script -->
  <script defer src="js/flight.js"></script>

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flight Styles -->
  <link href="css/flight-styles.css" rel="stylesheet" />
</head>

<body class="bg-[#440edf] text-[#111] font-sans m-0 h-screen overflow-hidden">

  <header class="px-2 py-1 bg-[#440edf] text-[#d2e823]">
    <div class="flex items-center justify-between mx-auto w-full">
      <a href="index.html" aria-label="MAPI home" class="flex items-center gap-2 font-bold text-lg text-[#d2e823]">
        <ion-icon name="map-outline" class="text-2xl" aria-hidden="true"></ion-icon>
        <span class="text-xl">MAPI</span>
      </a>
      <p class="m-0 text-md tracking-wide opacity-90 hidden md:block">Flight Simulator</p>
      <div class="flex items-center gap-2">
        <div id="modeToggle"
          class="flex items-center bg-[#3509b8] rounded-lg overflow-hidden border-2 border-[#d2e823]">
          <button id="modeFlatBtn" type="button" title="Flat Map" aria-label="Flat map mode"
            class="mode-btn active cursor-pointer px-4 py-2 text-[13px] font-bold transition-all duration-200 text-[#d2e823]">
            Flat
          </button>
          <button id="mode3dBtn" type="button" title="3D Globe" aria-label="3D globe mode"
            class="mode-btn cursor-pointer px-4 py-2 text-[13px] font-bold transition-all duration-200 text-[#d2e823] opacity-50">
            3D
          </button>
        </div>
        <button id="panelToggleBtn" type="button" title="Controls" aria-label="Toggle controls panel"
          aria-expanded="false"
          class="cursor-pointer rounded-xl border border-[#d2e823] px-3 py-2.5 text-[13px] font-semibold transition-all duration-200 bg-[#440edf] text-[#d2e823] hover:bg-[#d2e823] hover:text-[#000] hover:shadow-lg flex items-center justify-center">
          <ion-icon name="options-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </div>
  </header>

  <div id="container"
    class="flex h-[calc(100vh-44px)] rounded-xl m-2 overflow-hidden max-[900px]:flex-col max-[900px]:h-auto">

    <!-- Left Panel -->
    <section id="controls"
      class="w-[320px] bg-[#fafafa] p-4 h-full overflow-y-auto shrink-0 max-[900px]:w-full max-[900px]:h-auto">
      <div class="mobile-panel-header">
        <button id="panelCloseBtn" type="button" aria-label="Close controls panel">
          <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
      <div class="controls-body">

        <!-- Flight Section -->
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-1 h-4 bg-[#440edf] rounded-full"></div>
            <span class="text-[10px] font-semibold tracking-[1.5px] uppercase text-[#888]">Flight Route</span>
          </div>

          <!-- Origin -->
          <div class="mb-3">
            <label for="originInput" class="block text-[11px] font-medium text-[#666] mb-1">Origin</label>
            <div class="relative">
              <input id="originInput" type="text" placeholder="e.g. New York"
                class="w-full px-3 py-2 text-[13px] border border-[#ddd] rounded-lg focus:outline-none focus:border-[#440edf] focus:ring-1 focus:ring-[#440edf]/20" />
              <ul id="originAutocomplete" class="autocomplete-list" role="listbox"></ul>
            </div>
          </div>

          <!-- Destination -->
          <div class="mb-3">
            <label for="destInput" class="block text-[11px] font-medium text-[#666] mb-1">Destination</label>
            <div class="relative">
              <input id="destInput" type="text" placeholder="e.g. Paris"
                class="w-full px-3 py-2 text-[13px] border border-[#ddd] rounded-lg focus:outline-none focus:border-[#440edf] focus:ring-1 focus:ring-[#440edf]/20" />
              <ul id="destAutocomplete" class="autocomplete-list" role="listbox"></ul>
            </div>
          </div>

          <!-- Start Button -->
          <button id="startFlightBtn" type="button"
            class="w-full cursor-pointer bg-[#440edf] text-white font-semibold px-4 py-2.5 rounded-lg text-[13px] transition-all duration-200 hover:bg-[#3308b8] hover:shadow-lg flex items-center justify-center gap-2">
            <ion-icon name="airplane-outline" aria-hidden="true"></ion-icon>
            Start Flight
          </button>

          <!-- Flight Controls -->
          <div class="flex gap-2 mt-3">
            <button id="pauseBtn" type="button"
              class="hidden flex-1 cursor-pointer bg-[#f0f0f0] text-[#333] font-semibold px-3 py-2 rounded-lg text-[12px] transition-all duration-200 hover:bg-[#e0e0e0]">
              Pause
            </button>
            <button id="resetBtn" type="button"
              class="hidden flex-1 cursor-pointer bg-[#f0f0f0] text-[#333] font-semibold px-3 py-2 rounded-lg text-[12px] transition-all duration-200 hover:bg-[#e0e0e0]">
              Reset
            </button>
          </div>

          <!-- Status -->
          <p id="statusText" class="text-[11px] text-[#888] mt-2 min-h-[16px]"></p>
        </div>

        <!-- Speed & Camera -->
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-1 h-4 bg-[#440edf] rounded-full"></div>
            <span class="text-[10px] font-semibold tracking-[1.5px] uppercase text-[#888]">Controls</span>
          </div>

          <div class="mb-3">
            <label class="block text-[11px] font-medium text-[#666] mb-1">Speed: <span id="speedValue">1x</span></label>
            <input id="speedSlider" type="range" min="0" max="4" step="1" value="2"
              class="w-full h-1.5 bg-[#ddd] rounded-lg appearance-none cursor-pointer accent-[#440edf]" />
          </div>

          <button id="cameraModeBtn" type="button"
            class="w-full cursor-pointer bg-[#f0f0f0] text-[#333] font-semibold px-3 py-2 rounded-lg text-[12px] transition-all duration-200 hover:bg-[#e0e0e0] flex items-center justify-center gap-2">
            <ion-icon name="videocam-outline" aria-hidden="true"></ion-icon>
            Follow
          </button>



          <div class="mt-3">
            <label for="formatSelect" class="block text-[11px] font-medium text-[#666] mb-1">Video Format</label>
            <select id="formatSelect"
              class="w-full px-3 py-2 text-[13px] border border-[#ddd] rounded-lg focus:outline-none focus:border-[#440edf]">
              <option value="free">Free (fill screen)</option>
              <option value="reel" selected>Reel / TikTok 9:16</option>
              <option value="feed">Feed Post 4:5</option>
              <option value="square">Square 1:1</option>
              <option value="landscape">Landscape 16:9</option>
            </select>
            <p class="text-[10px] text-[#999] mt-1">Screen-record · renders 1080p+ on Retina</p>
            <p id="formatSizeText" class="text-[10px] text-[#999] mt-0.5 font-mono">540 × 960 px</p>
          </div>
        </div>

        <!-- Theme Section -->
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-3">
            <div class="w-1 h-4 bg-[#440edf] rounded-full"></div>
            <span class="text-[10px] font-semibold tracking-[1.5px] uppercase text-[#888]">Theme</span>
          </div>

          <select id="styleSelect"
            class="w-full px-3 py-2 text-[13px] border border-[#ddd] rounded-lg focus:outline-none focus:border-[#440edf] mb-3">
          </select>

          <div id="themesGrid" class="themes-grid"></div>
        </div>

      </div>
    </section>

    <!-- Map Area -->
    <main
      class="flex-1 relative bg-[#e5e5e5] overflow-hidden rounded-r-xl max-[900px]:rounded-xl max-[900px]:min-h-[70vh] flex items-center justify-center p-4">
      <div id="mapArea" class="relative overflow-hidden rounded-lg"
        style="width:540px;height:960px;max-width:100%;max-height:100%;">
        <div id="mapContainer" class="absolute rounded-lg" style="width:940px;height:1360px;top:-200px;left:-200px;">
        </div>
        <!-- 3D Globe Container -->
        <div id="globe3dContainer" class="absolute inset-0 rounded-lg hidden" style="z-index:5;"></div>

        <!-- Flight HUD -->
        <div id="flightHud" class="flight-hud hidden">
          <h3>Flight Info</h3>
          <div class="hud-route">
            <span id="hudOrigin">---</span>
            <span class="arrow">&rarr;</span>
            <span id="hudDest">---</span>
          </div>
          <div class="hud-stats">
            <div>
              <div class="hud-stat-label">Distance</div>
              <div class="hud-stat-value" id="hudDistance">---</div>
            </div>
            <div>
              <div class="hud-stat-label">ETA</div>
              <div class="hud-stat-value" id="hudEta">---</div>
            </div>
            <div>
              <div class="hud-stat-label">Progress</div>
              <div class="hud-stat-value" id="hudProgress">0%</div>
            </div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div id="progressBar" class="flight-progress-bar hidden">
          <div id="progressFill" class="flight-progress-fill"></div>
        </div>
      </div><!-- /mapArea -->
    </main>

  </div>
</body>

</html>
